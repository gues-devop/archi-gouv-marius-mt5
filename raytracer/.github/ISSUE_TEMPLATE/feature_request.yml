name: Feature request
description: Suggest an improvement or new capability.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: Describe the problem this suggestion would address.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives you considered.
    validations:
      required: false
